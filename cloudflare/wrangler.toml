name = "folia-cf-www"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# workers_dev must be explicit once routes are declared, or the workers.dev
# preview url is turned off -- which is the url used to check this worker
# before and after a change.
workers_dev = true

# The hostnames this worker answers on. custom_domain means Cloudflare owns the
# DNS record and the certificate. Recorded here so the repo, not a dashboard,
# says which worker serves which hostname -- and so the binding is recreated if
# the worker ever is.
routes = [
  { pattern = "www.folia.app", custom_domain = true },
  # The bare domain, which only ever 301s to www (see src/index.js). It has to
  # be listed here and not just attached: wrangler reconciles custom domains
  # against this array on every deploy, so a domain attached out of band is
  # removed by the next one -- which is exactly what happened to this one.
  { pattern = "folia.app", custom_domain = true },
]

[assets]
directory = "../dist"
binding = "ASSETS"
# The worker resolves paths itself so that Cloudflare and Netlify agree on
# what /foo and /foo.html each mean. See the header comment in src/index.js.
html_handling = "none"
not_found_handling = "none"

[alias]
# Both are node-host concerns the lambda pulls in but does not depend on.
dotenv = "./src/shims/dotenv.js"
encoding = "./src/shims/encoding.js"

[vars]
# The lambda reads these off process.env; nodejs_compat populates it from here.
# Both are public values that already appear in every metadata document served,
# and both must match Netlify exactly -- they are the base of every image and
# external_url that consumers have stored against these tokens.
VUE_APP_CANONICAL_DOMAIN = "https://www.folia.app"
VUE_APP_IPFS_ORIGIN = "https://following-quelea-awffk.lighthouseweb3.xyz"

# One-shot, manually triggered helper for moving the folia.app apex off Netlify.
#
# The apex A record (75.2.60.5) points at Netlify's load balancer and is
# DNS-only, so Cloudflare never sees the request and neither a Worker route nor
# a redirect rule can intercept it. Attaching a Workers custom domain over it
# fails with 100117 -- "already has externally managed DNS records" -- and
# override_existing_dns_record does not cover a hand-made record. It has to be
# deleted through the DNS API first.
#
# This runs here, rather than from a laptop, because the only credential with
# the necessary scope is this repo's own CLOUDFLARE_API_TOKEN. It is folia's
# token acting on folia's zone for folia's migration.
#
# Delete this workflow once the apex is attached.
name: apex-dns

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'probe (read-only) | delete | attach | restore'
        required: true
        default: probe

jobs:
  apex:
    runs-on: ubuntu-latest
    steps:
      - name: Act on the folia.app apex
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail
          ZONE=688237d6253d4e651f8268d556b9fdb3
          API=https://api.cloudflare.com/client/v4
          # -s so the token never reaches the log via a redirect trace.
          cf () { curl -s -X "$1" "$API$2" \
                    -H "Authorization: Bearer $CF_TOKEN" \
                    -H "Content-Type: application/json" \
                    ${3:+--data "$3"}; }

          echo "::group::what this token can do"
          for probe in "/zones/$ZONE" "/zones/$ZONE/dns_records?name=folia.app"; do
            ok=$(cf GET "$probe" | jq -r '.success')
            echo "  GET $probe -> success=$ok"
          done
          echo "::endgroup::"

          RECORDS=$(cf GET "/zones/$ZONE/dns_records?name=folia.app")
          echo "current apex records:"
          echo "$RECORDS" | jq -r '.result[]? | "  \(.type) \(.name) -> \(.content) proxied=\(.proxied) id=\(.id)"'

          case "$ACTION" in
            probe)
              echo "probe only; nothing changed."
              ;;
            delete)
              ID=$(echo "$RECORDS" | jq -r '.result[] | select(.type=="A" and .content=="75.2.60.5") | .id')
              [ -n "$ID" ] || { echo "no matching A record; refusing to guess"; exit 1; }
              cf DELETE "/zones/$ZONE/dns_records/$ID" | jq -r '"delete success=\(.success)"'
              ;;
            cutover)
              # delete and attach in one run: between the two the apex has no
              # record at all, so the gap is kept to a single API round trip
              # rather than the minutes between two manual dispatches.
              ID=$(echo "$RECORDS" | jq -r '.result[] | select(.type=="A" and .content=="75.2.60.5") | .id')
              [ -n "$ID" ] || { echo "no matching A record; refusing to guess"; exit 1; }
              cf DELETE "/zones/$ZONE/dns_records/$ID" | jq -r '"delete success=\(.success)"'
              cf PUT "/accounts/$CF_ACCOUNT/workers/domains" \
                '{"environment":"production","hostname":"folia.app","service":"folia-cf-www","zone_id":"'"$ZONE"'"}' \
                | jq -r '"attach success=\(.success) \(.errors // [] | tostring)"'
              echo "resulting records:"
              cf GET "/zones/$ZONE/dns_records?name=folia.app" \
                | jq -r '.result[]? | "  \(.type) \(.name) -> \(.content) proxied=\(.proxied)"'
              ;;
            attach)
              cf PUT "/accounts/$CF_ACCOUNT/workers/domains" \
                '{"environment":"production","hostname":"folia.app","service":"folia-cf-www","zone_id":"'"$ZONE"'"}' \
                | jq -r '"attach success=\(.success) \(.errors // [] | tostring)"'
              ;;
            restore)
              # Puts back exactly what was there before, for rollback.
              cf POST "/zones/$ZONE/dns_records" \
                '{"type":"A","name":"folia.app","content":"75.2.60.5","proxied":false,"ttl":1}' \
                | jq -r '"restore success=\(.success) \(.errors // [] | tostring)"'
              ;;
          esac
